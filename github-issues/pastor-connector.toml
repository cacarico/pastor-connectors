# GitHub issues as pastor items: one task per labelled issue, a comment on
# the issue when the task ends. Talks to GitHub through the gh CLI, so the
# login gh already has is the only credential; nothing goes in .env.
id = "github-issues"
name = "GitHub Issues"
version = "0.3.0"
# 0.7.0 added [finish]; older versions reject it as an unknown key.
min_pastor_version = "0.7.0"
description = "One item per issue carrying a label; comments on the issue when its task ends"

[connector]
mode = "poll"
command = ["sh", "poll.sh"]
timeout = "60s"

[connector.config.repo]
required = true
description = "Repository to watch, as owner/name"

[connector.config.label]
description = "Only issues carrying this label become items (default: pastor)"

[connector.config.state]
description = "open, closed or all (default: open)"

# Tells the issue how its task ended, with the branch and its pull request.
# pastor runs it once per task, only for this connector's own jobs, on done
# or failed.
[finish]
command = ["sh", "finish.sh"]
